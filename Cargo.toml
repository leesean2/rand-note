[package]
name = "rand-note"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
uuid = { version = "1", features = ["v4", "js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
