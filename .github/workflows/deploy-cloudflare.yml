name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting and tests
        run: |
          npm run fmt
          npm test

      - name: Build Worker
        run: npm run build:worker

      - name: Apply new D1 migrations
        run: npx wrangler d1 migrations apply rand-note --remote

      - name: Deploy Worker API
        run: npm run deploy:worker

      - name: Deploy Pages frontend
        run: npm run deploy:pages
